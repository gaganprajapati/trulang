[package]
name = "trulang_net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native non-blocking asynchronous network and HTTP/1.1 engine for TruLang"
[dependencies]
trulang_syntax = { path = "../syntax" }
trulang_compiler = { path = "../compiler" }
trulang_vm = { path = "../vm" }
trulang_supervisor = { path = "../supervisor" }
trulang_ffi = { path = "../ffi" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
rustls = { version = "0.23", default-features = true, features = ["ring", "std"] }
rustls-pki-types = "1.7"
rustls-pemfile = "2.1"
webpki-roots = "0.26"
ring = "0.17"
base64 = "0.22"

[dev-dependencies]
rcgen = "0.13"

