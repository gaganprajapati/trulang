apiVersion: v1
kind: Service
metadata:
  name: trulang-api-gateway
  namespace: default
  labels:
    app.kubernetes.io/name: trulang-api-gateway
    app.kubernetes.io/part-of: trulang
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: trulang-api-gateway
