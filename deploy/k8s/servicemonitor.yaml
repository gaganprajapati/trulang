apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trulang-api-gateway
  namespace: default
  labels:
    app.kubernetes.io/name: trulang-api-gateway
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: trulang-api-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
