[workspace]
resolver = "2"
members = [
    "crates/syntax",
    "crates/compiler",
    "crates/vm",
    "crates/supervisor",
    "crates/lsp",
    "crates/ffi",
    "crates/codegen",
    "crates/net",
    "crates/pkg",
    "crates/db",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
logos = "0.14"
clap = { version = "4.5", features = ["derive"] }
mmap-rs = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
memmap2 = "0.9"
toml = "0.8"
sha2 = "0.10"
