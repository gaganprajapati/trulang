name: VS Code Extension CI/CD

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: editors/vscode

jobs:
  build-and-package:
    name: Build & Package Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build extension bundle
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: trulang-vscode-extension
          path: editors/vscode/*.vsix

  publish:
    name: Publish Extension (Marketplace & Open VSX)
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: trulang-vscode-extension
          path: editors/vscode

      # 1. Visual Studio Marketplace via Microsoft Entra ID (OIDC Workload Identity Federation)
      - name: Authenticate to Microsoft Entra ID (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Publish to Visual Studio Marketplace (Entra ID)
        if: env.AZURE_CLIENT_ID != ''
        run: npx @vscode/vsce publish --azure-credential
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      # 2. Visual Studio Marketplace Fallback via VSCE_PAT (Retiring Dec 1, 2026)
      - name: Publish to Visual Studio Marketplace (Legacy PAT)
        if: env.AZURE_CLIENT_ID == '' && env.VSCE_PAT != ''
        run: |
          echo "::warning::Using legacy VSCE_PAT personal access token. Global PATs retire on Dec 1, 2026; migrate to Microsoft Entra ID."
          npx @vscode/vsce publish -p "${{ secrets.VSCE_PAT }}"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # 3. Open VSX Registry Publishing
      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: npx ovsx publish -p "${{ secrets.OVSX_PAT }}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
